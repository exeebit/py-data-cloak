[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-data-cloak"
version = "0.2.0"
description = "Rule-based data anonymization and sanitization for CLI, Django, Pandas, and SQL dumps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "s4gor", email = "imrans4gor@gmail.com" }]
keywords = ["anonymization", "masking", "pii", "privacy", "gdpr", "data", "django", "faker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "Faker>=20.0.0",
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
django = ["Django>=3.2"]
pandas = ["pandas>=1.3"]
vault = ["cryptography>=40.0"]
all = ["Django>=3.2", "pandas>=1.3", "cryptography>=40.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
pycloak = "pycloak.cli:main"

[project.urls]
Homepage = "https://github.com/exeebit/py-data-cloak"
Issues = "https://github.com/exeebit/py-data-cloak/issues"

[tool.setuptools.packages.find]
include = ["pycloak*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
